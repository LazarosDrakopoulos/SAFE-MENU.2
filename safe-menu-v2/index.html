<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/SAFE-MENU.2/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <meta name="description" content="Safe Menu — Discover food safe for your allergies" />
    <title>Safe Menu</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
  (function() {
    var redirect = sessionStorage.getItem('sm_redirect');
    if (redirect) {
      sessionStorage.removeItem('sm_redirect');
      window.history.replaceState(null, '', '/SAFE-MENU.2' + redirect);
    }
  })();
</script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
